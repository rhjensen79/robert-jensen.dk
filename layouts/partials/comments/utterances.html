<!-- Lazy-loaded Utterances Comments -->
<div id="utterances-container" style="min-height: 200px;">
  <div id="utterances-placeholder" style="text-align: center; padding: 40px 20px; border: 1px solid #e1e8ed; border-radius: 6px; margin: 20px 0; cursor: pointer;">
    <p style="color: #586069; margin: 0 0 10px 0;">💬 Comments are available</p>
    <button id="load-comments" style="background: #0366d6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;">
      Load Comments
    </button>
  </div>
</div>

<script>
  let utterancesLoaded = false;
  
  function loadUtterances() {
    if (utterancesLoaded) return;
    utterancesLoaded = true;
    
    // Remove placeholder
    const placeholder = document.getElementById('utterances-placeholder');
    if (placeholder) {
      placeholder.remove();
    }
    
    // Create and load utterances script
    const script = document.createElement('script');
    script.src = 'https://utteranc.es/client.js';
    script.setAttribute('repo', '{{ .Site.Params.utterances.repo }}');
    script.setAttribute('issue-term', '{{ .Site.Params.utterances.issueTerm }}');
    script.setAttribute('theme', '{{ .Site.Params.utterances.theme }}');
    {{ with .Site.Params.utterances.label }}
    script.setAttribute('label', '{{ . }}');
    {{ end }}
    script.setAttribute('crossorigin', 'anonymous');
    script.async = true;
    
    // Add to container
    const container = document.getElementById('utterances-container');
    if (container) {
      container.appendChild(script);
    }
  }
  
  // Load on button click
  document.addEventListener('DOMContentLoaded', function() {
    const loadButton = document.getElementById('load-comments');
    const placeholder = document.getElementById('utterances-placeholder');
    
    if (loadButton) {
      loadButton.addEventListener('click', loadUtterances);
    }
    
    if (placeholder) {
      placeholder.addEventListener('click', loadUtterances);
    }
    
    // Auto-load when user scrolls near the comments section
    const container = document.getElementById('utterances-container');
    if (container && 'IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.1) {
            loadUtterances();
            observer.unobserve(entry.target);
          }
        });
      }, {
        rootMargin: '50px'
      });
      
      observer.observe(container);
    }
  });
</script>
