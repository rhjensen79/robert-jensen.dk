<!-- Critical CSS for above-the-fold content -->
<style>
/* Critical layout and reset */
html{line-height:1.15;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.5;color:#212529;background-color:#fff}
*,::after,::before{box-sizing:border-box}

/* Critical navigation */
.navbar{position:fixed;top:0;width:100%;background:#fff;z-index:1000;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:1rem}
.navbar__list{list-style:none;margin:0;padding:0;display:flex}
.navbar__item{margin-right:1rem}

/* Critical content structure */
.wrapper{max-width:1200px;margin:0 auto;padding:80px 20px 20px}
.post{margin-bottom:2rem;background:#fff}
.post__thumbnail{width:100%;height:auto;display:block}
.post__thumbnail-wrapper{overflow:hidden;margin-bottom:1rem}
.post__content{padding:1rem}
.post__content h3{margin-top:0}

/* Critical text */
h1,h2,h3{font-weight:500;line-height:1.2;margin-bottom:.5rem}
a{color:#007bff;text-decoration:none}
p{margin-top:0;margin-bottom:1rem}

/* Mobile critical */
@media(max-width:768px){
  .wrapper{padding:60px 10px 10px}
  .post__content{padding:.75rem}
}

/* Prevent layout shift */
img{max-width:100%;height:auto}
.post__thumbnail-wrapper{aspect-ratio:16/9}
</style>
