{{ define "main" }}
  <header class="head">
    <h1 class="head__title" data-rise>{{ .Title }}</h1>
    <p class="head__note">{{ len .Data.Terms }} topics across {{ len (where site.RegularPages "Section" "posts") }} posts.</p>
  </header>
  <p class="cloud">
    {{ range $i, $t := .Data.Terms.ByCount }}
      {{- if $i }}, {{ end -}}
      <a href="{{ .Page.RelPermalink }}">{{ partial "tag-name.html" .Term }}&nbsp;<span>{{ .Count }}</span></a>
    {{- end }}.
  </p>
{{ end }}
