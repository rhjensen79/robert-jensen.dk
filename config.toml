baseURL = "https://robert-jensen.dk"
languageCode = "en"
DefaultContentLanguage = "en"
title = "Robert-Jensen.dk"
#theme = "anatole"
summarylength = 50
enableEmoji = true
enableRobotsTXT = true
#ignoreLogs = 'err-youtube-remote'

# Syntax highlighting
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true

[params]
title = "Robert-Jensen.dk"
author = "Robert Jensen"
description = "A place for my random ramblings. Mostly about VMware, Cloud Native, DevOps etc. but not limited to that :-) "
profilePicture = "/images/profile.webp"
keywords = "VMware, Blog, robert-jensen, Automation, DevOps, Python, golang, Cloud Native, Devops, Kubernetes"
favicon = "favicons/"
customCss = ["css/performance.css", "css/fontawesome-minimal.css"]
customJs = []
mainSections = ["posts"]
images = ["images/thom-holmes-k-xKzowQRn8-unsplash.jpg"]
# Google Site Verification
# Google Search Console verified via DNS records
copyright = "2019-{{ YEAR }}"
relatedPosts = true
numberOfRelatedPosts = 3
contentratio = 0.8
#hidesidebar = true
gtagId = "G-545708GXNW"

# Social Media and SEO
[params.seo]
twitterCard = "summary_large_image"
ogType = "website"

[params.utterances]
repo = "rhjensen79/robert-jensen.dk"
issueTerm = "pathname"
theme= "github-light"
# label = "comment"

[params.umami]
serverURL = "umami.robert-jensen.dk"
id = "f31c28bb-490d-4f20-8052-5e9e0c062e05"
trackerScriptName = "script.js"

## Math settings
[params.math]
enable = false  # options: true, false. Enable math support globally, default: false. You can always enable math on per page.
use = "katex"  # options: "katex", "mathjax". default is "katex".

